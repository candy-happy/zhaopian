<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>3D 荧光花朵 - 洁白盛放</title>
 <style>
 :root {
 --bg: #05060f;
 }

 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }

 body {
 background: var(--bg);
 overflow: hidden;
 font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', serif;
 cursor: grab;
 -webkit-user-select: none;
 user-select: none;
 -webkit-tap-highlight-color: transparent;
 height: 100vh;
 width: 100vw;
 }

 body:active {
 cursor: grabbing;
 }

 body.grabbing {
 cursor: grabbing;
 }

 canvas {
 display: block;
 }

 .hint {
 position: fixed;
 bottom: 40px;
 left: 50%;
 transform: translateX(-50%);
 color: rgba(255, 255, 255, 0.6);
 font-size: 15px;
 letter-spacing: 0.08em;
 pointer-events: none;
 z-index: 10;
 text-align: center;
 transition: opacity 1.5s ease;
 text-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
 }

 .hint.fading {
 opacity: 0.15;
 }

 .title-area {
 position: fixed;
 top: 28px;
 left: 50%;
 transform: translateX(-50%);
 pointer-events: none;
 z-index: 10;
 text-align: center;
 }

 .title-area .sub {
 font-size: 13px;
 letter-spacing: 0.2em;
 color: rgba(255, 255, 255, 0.45);
 text-shadow: 0 0 20px rgba(200, 210, 255, 0.3);
 }

 @media (max-width: 600px) {
 .hint {
 bottom: 28px;
 font-size: 13px;
 }
 .title-area .sub {
 font-size: 11px;
 letter-spacing: 0.14em;
 }
 }
 </style>
</head>
<body>

 <div class="title-area">
 <span class="sub">皎 · 华</span>
 </div>
 <div class="hint" id="hint">✦ 拖拽鼠标旋转查看 &nbsp;|&nbsp; 滚轮缩放 ✦</div>

 <script type="importmap">
 {
 "imports": {
 "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
 }
 </script>

 <script type="module">
 import * as THREE from 'three';
 import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
 import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
 import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
 import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

 // ==================== 场景初始化 ====================
 const scene = new THREE.Scene();
 scene.background = new THREE.Color('#06080f');
 scene.fog = new THREE.Fog('#06080f', 6, 30);

 const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.15, 50);
 camera.position.set(0.8, 0.55, 5.2);
 camera.lookAt(0, 0.25, 0);

 const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
 renderer.setSize(window.innerWidth, window.innerHeight);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
 renderer.shadowMap.enabled = true;
 renderer.shadowMap.type = THREE.PCFSoftShadowMap;
 renderer.toneMapping = THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure = 1.15;
 document.body.appendChild(renderer.domElement);

 // ==================== 后处理 - 荧光Bloom ====================
 const composer = new EffectComposer(renderer);
 const renderPass = new RenderPass(scene, camera);
 composer.addPass(renderPass);

 const bloomPass = new UnrealBloomPass(
 new THREE.Vector2(window.innerWidth, window.innerHeight),
 0.28,
 0.35,
 0.75
 );
 bloomPass.threshold = 0.75;
 bloomPass.strength = 0.28;
 bloomPass.radius = 0.35;
 composer.addPass(bloomPass);

 // ==================== OrbitControls - 拖拽旋转 ====================
 const controls = new OrbitControls(camera, renderer.domElement);
 controls.target.set(0, 0.22, 0);
 controls.enableDamping = true;
 controls.dampingFactor = 0.08;
 controls.minDistance = 2.2;
 controls.maxDistance = 10;
 controls.maxPolarAngle = Math.PI * 0.78;
 controls.minPolarAngle = 0.15;
 controls.autoRotate = true;
 controls.autoRotateSpeed = 0.35;
 controls.update();

 // 交互状态提示
 const hintEl = document.getElementById('hint');
 let interactionTimeout;
 const showHint = () => {
 hintEl.classList.remove('fading');
 clearTimeout(interactionTimeout);
 interactionTimeout = setTimeout(() => {
 hintEl.classList.add('fading');
 }, 4000);
 };
 showHint();
 renderer.domElement.addEventListener('pointerdown', () => {
 hintEl.classList.add('fading');
 controls.autoRotateSpeed = 0.08;
 document.body.classList.add('grabbing');
 });
 renderer.domElement.addEventListener('pointerup', () => {
 controls.autoRotateSpeed = 0.35;
 document.body.classList.remove('grabbing');
 showHint();
 });
 renderer.domElement.addEventListener('wheel', () => {
 showHint();
 });

 // ==================== 光照 ====================
 // 环境光 - 提供基础照明
 const ambientLight = new THREE.AmbientLight('#f8f4ff', 0.35);
 scene.add(ambientLight);

 // 半球光 - 天空+地面模拟
 const hemiLight = new THREE.HemisphereLight('#ffffff', '#1a1a30', 0.35);
 scene.add(hemiLight);

 // 主方向光 - 产生高光和阴影
 const keyLight = new THREE.DirectionalLight('#ffffff', 1.8);
 keyLight.position.set(5, 6, 4);
 keyLight.castShadow = true;
 keyLight.shadow.mapSize.width = 2048;
 keyLight.shadow.mapSize.height = 2048;
 keyLight.shadow.camera.near = 0.3;
 keyLight.shadow.camera.far = 25;
 keyLight.shadow.camera.left = -6;
 keyLight.shadow.camera.right = 6;
 keyLight.shadow.camera.top = 6;
 keyLight.shadow.camera.bottom = -6;
 keyLight.shadow.bias = -0.00015;
 keyLight.shadow.normalBias = 0.02;
 scene.add(keyLight);

 // 补光 - 从侧面柔化阴影
 const fillLight = new THREE.DirectionalLight('#e8e0ff', 0.9);
 fillLight.position.set(-3, 2, -1.5);
 scene.add(fillLight);

 // 底部反弹光 - 减少暗面过黑
 const bounceLight = new THREE.DirectionalLight('#c8d0ff', 0.6);
 bounceLight.position.set(0, -0.8, 1.5);
 scene.add(bounceLight);

 // 顶部柔光 - 花瓣边缘高光
 const rimLight = new THREE.DirectionalLight('#ffffff', 0.8);
 rimLight.position.set(0, 4, -2);
 scene.add(rimLight);

 // ==================== 花瓣几何体（程序化 - 借鉴shader版花瓣形状） ====================
 // 菊花花瓣参数
 const basePetalHeight = 1.65;
 const baseMaxWidth = 0.22;

 function createPetalGeometry(curlAmount) {
 const segX = 12, segY = 28;
 const h = basePetalHeight;
 const mw = baseMaxWidth;
 const curl = curlAmount || 0.4;
 const positions = [], uvs = [], indices = [];

 for (let iy = 0; iy <= segY; iy++) {
 const v = iy / segY;
 for (let ix = 0; ix <= segX; ix++) {
 const u = ix / segX;

 // 菊花管瓣宽度分布：底部窄→中段最宽→顶端圆润收尖
 // 借鉴shader版 sin(v*PI) 曲线，顶端加宽让尖端更圆润
 const widthProfile = Math.sin(v * Math.PI);
 // 顶端圆润化：不让宽度归零，用smoothstep让尖端变圆
 const tipRound = v > 0.75 ? 0.25 + 0.75 * (1.0 - (v - 0.75) / 0.25) * ((v - 0.75) / 0.25 + 0.5) : 1.0;
 const widthAtV = widthProfile * tipRound * (mw * 0.9 + mw * 0.3 * v);
 const tipWidth = 0.015; // 顶端最小宽度
 const finalWidth = Math.max(widthAtV, tipWidth);
 const x = (u - 0.5) * finalWidth;
 const y = v * h;

 // 花瓣自然弯曲：借鉴shader版的 -v*v*0.6 弧度
 // 加上菊花的末端上翘和向内聚拢
 const t = v; // 归一化 0=底 1=顶

 // Z: 先向外弯，中后段最弯，末端回卷向内
 const outwardBend = curl * 1.8 * t * (1 - t * 0.85);
 // 基础弧度（shader风格的向后弯）
 const baseCurve = -t * t * 0.6 + Math.sin(t * Math.PI) * 0.03;
 const z = baseCurve + outwardBend;

 // Y: 末端上翘
 const upwardCurl = curl * 0.8 * t * t * t;
 const finalY = y + upwardCurl;

 // X: 末端向中线聚拢
 const inwardGather = curl * 0.35 * t * t * t;
 const finalX = x * (1 - inwardGather);

 positions.push(finalX, finalY, z);
 uvs.push(u, v);
 }
 }

 for (let iy = 0; iy < segY; iy++) {
 for (let ix = 0; ix < segX; ix++) {
 const a = iy * (segX + 1) + ix;
 const b = a + 1;
 const c = a + (segX + 1);
 const d = c + 1;
 indices.push(a, c, b, b, c, d);
 }
 }

 const geo = new THREE.BufferGeometry();
 geo.setIndex(indices);
 geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
 geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
 geo.computeVertexNormals();
 return geo;
 }

 // ==================== 花瓣材质 ====================
 // 为每层创建独立材质（用于不同的emissive相位）
 const petalMaterials = [];
 for (let i = 0; i < 8; i++) {
 const mat = new THREE.MeshStandardMaterial({
 color: new THREE.Color('#fffef5'),
 roughness: 0.4,
 metalness: 0.02,
 emissive: new THREE.Color('#fff8e0'),
 emissiveIntensity: 0.02,
 side: THREE.DoubleSide,
 flatShading: false,
 });
 petalMaterials.push(mat);
 }

 // ==================== 构建花朵 ====================
 const flowerGroup = new THREE.Group();
 scene.add(flowerGroup);

 // 菊花8层配置：从外到内，花瓣数递减，倾斜角递减（内层更直立）
 const layerConfigs = [
 { count: 24, scale: 1.0,  tiltAngle: 68, yOffset: -0.15, angleOffset: 0,    curl: 1.4 },
 { count: 22, scale: 0.92, tiltAngle: 60, yOffset: -0.06, angleOffset: 0.3,  curl: 1.2 },
 { count: 20, scale: 0.82, tiltAngle: 50, yOffset: 0.02,  angleOffset: 0.6,  curl: 1.0 },
 { count: 16, scale: 0.70, tiltAngle: 40, yOffset: 0.08,  angleOffset: 0.15, curl: 0.75 },
 { count: 14, scale: 0.58, tiltAngle: 30, yOffset: 0.13,  angleOffset: 0.45, curl: 0.55 },
 { count: 10, scale: 0.46, tiltAngle: 22, yOffset: 0.18,  angleOffset: 0.75, curl: 0.35 },
 { count: 8,  scale: 0.36, tiltAngle: 14, yOffset: 0.22,  angleOffset: 0.1,  curl: 0.2 },
 { count: 6,  scale: 0.28, tiltAngle: 8,  yOffset: 0.25,  angleOffset: 0.5,  curl: 0.1 },
 ];

 const totalPetals = layerConfigs.reduce((sum, cfg) => sum + cfg.count, 0);
 console.log(`🌸 花瓣总数: ${totalPetals} 片 (8层结构)`);

 // 存储所有花瓣group引用
 const allPetalGroups = [];

 layerConfigs.forEach((config, layerIndex) => {
 const { count, scale, tiltAngle, yOffset, angleOffset } = config;

 // 为该层创建几何体（程序化BufferGeometry，每层不同的弯曲量）
 const geometry = createPetalGeometry(config.curl);
 const material = petalMaterials[layerIndex];

 const baseAngleStep = (Math.PI * 2) / count;
 const startAngle = angleOffset * baseAngleStep;

 for (let i = 0; i < count; i++) {
 const petalGroup = new THREE.Group();

 // 花瓣mesh
 const petalMesh = new THREE.Mesh(geometry, material);
 petalMesh.castShadow = true;
 petalMesh.receiveShadow = true;

 // 花瓣Shape在XY平面，尖端+Y，Extrude沿Z
 // 绕X轴旋转使花瓣向外倾斜
 const tiltRad = THREE.MathUtils.degToRad(tiltAngle);
 const tiltVariation = (Math.random() - 0.5) * 0.04;
 const actualTilt = tiltRad + tiltVariation;

 petalMesh.rotation.x = actualTilt;

 // 绕花瓣长轴(Y轴)的微扭转
 const twist = (Math.random() - 0.5) * 0.06;
 petalMesh.rotation.y = twist;

 petalGroup.add(petalMesh);

 // 在圆周上均匀分布
 const angle = startAngle + i * baseAngleStep;
 petalGroup.rotation.y = angle;

 // Y轴偏移（层次）
 petalGroup.position.y = yOffset;

 // 缩放
 const s = scale;
 petalGroup.scale.set(s, s, s);

 flowerGroup.add(petalGroup);
 allPetalGroups.push({ group: petalGroup, layerIndex, baseY: yOffset, baseScale: scale });
 }
 });

 // ==================== 花蕊 ====================
 const stamenGroup = new THREE.Group();
 stamenGroup.position.y = 0.30;
 flowerGroup.add(stamenGroup);

 // 菊花花蕊材质 - 黄绿色
 const stamenMaterial = new THREE.MeshStandardMaterial({
 color: new THREE.Color('#c8b840'),
 roughness: 0.45,
 metalness: 0.05,
 emissive: new THREE.Color('#b0a030'),
 emissiveIntensity: 0.03,
 side: THREE.DoubleSide,
 });

 const stamenTipMaterial = new THREE.MeshStandardMaterial({
 color: new THREE.Color('#d4c850'),
 roughness: 0.35,
 metalness: 0.03,
 emissive: new THREE.Color('#c8b840'),
 emissiveIntensity: 0.04,
 side: THREE.DoubleSide,
 });

 // 菊花中心花蕊盘 - 圆盘形
 const diskGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.08, 24, 4);
 const disk = new THREE.Mesh(diskGeo, stamenMaterial);
 disk.position.y = 0.02;
 disk.castShadow = true;
 stamenGroup.add(disk);

 // 花蕊盘上的小颗粒 - 菊花特征
 const dotCount = 60;
 const dotGeo = new THREE.SphereGeometry(0.012, 6, 4);
 for (let i = 0; i < dotCount; i++) {
 const dot = new THREE.Mesh(dotGeo, stamenTipMaterial);
 const phi = Math.random() * Math.PI * 2;
 const r = Math.random() * 0.17;
 dot.position.set(
 Math.cos(phi) * r,
 0.06 + Math.random() * 0.02,
 Math.sin(phi) * r
 );
 dot.castShadow = true;
 stamenGroup.add(dot);
 }

 // 周围的细小花蕊
 const stamenCount = 30;
 for (let i = 0; i < stamenCount; i++) {
 const stamenGroupSingle = new THREE.Group();

 const stemGeo = new THREE.CylinderGeometry(0.006, 0.010, 0.4, 6, 4);
 const stem = new THREE.Mesh(stemGeo, stamenMaterial);
 stem.position.y = 0.18;
 stem.castShadow = true;
 stamenGroupSingle.add(stem);

 const tipGeo = new THREE.SphereGeometry(0.014, 6, 4);
 const tip = new THREE.Mesh(tipGeo, stamenTipMaterial);
 tip.position.y = 0.39;
 tip.castShadow = true;
 stamenGroupSingle.add(tip);

 const phi = Math.random() * Math.PI * 2;
 const radius = 0.10 + Math.random() * 0.12;
 const tiltOut = 0.1 + Math.random() * 0.3;

 stamenGroupSingle.position.x = Math.cos(phi) * radius;
 stamenGroupSingle.position.z = Math.sin(phi) * radius;
 stamenGroupSingle.rotation.z = (Math.random() - 0.5) * 0.3;
 stamenGroupSingle.rotation.x = Math.cos(phi) * tiltOut;

 stamenGroup.add(stamenGroupSingle);
 }

 // ==================== 花萼 ====================
 const sepalGroup = new THREE.Group();
 sepalGroup.position.y = -0.25;
 flowerGroup.add(sepalGroup);

 const sepalMaterial = new THREE.MeshStandardMaterial({
 color: new THREE.Color('#3a5a30'),
 roughness: 0.55,
 metalness: 0.05,
 emissive: new THREE.Color('#1a3010'),
 emissiveIntensity: 0.04,
 side: THREE.DoubleSide,
 });

 // 花萼小片
 const sepalCount = 7;
 for (let i = 0; i < sepalCount; i++) {
 const sepalShape = new THREE.Shape();
 sepalShape.moveTo(0, 0);
 sepalShape.bezierCurveTo(0.12, 0.08, 0.18, 0.3, 0.04, 0.5);
 sepalShape.bezierCurveTo(0.01, 0.55, -0.01, 0.55, -0.04, 0.5);
 sepalShape.bezierCurveTo(-0.18, 0.3, -0.12, 0.08, 0, 0);

 const sepalGeo = new THREE.ExtrudeGeometry(sepalShape, {
 steps: 1,
 depth: 0.02,
 bevelEnabled: true,
 bevelThickness: 0.005,
 bevelSize: 0.005,
 bevelSegments: 2,
 });
 const sepalMesh = new THREE.Mesh(sepalGeo, sepalMaterial);
 sepalMesh.castShadow = true;
 sepalMesh.receiveShadow = true;

 const angle = (i / sepalCount) * Math.PI * 2 + Math.random() * 0.15;
 sepalMesh.rotation.x = -0.7;
 sepalMesh.rotation.y = angle;
 sepalMesh.position.y = -0.08;

 sepalGroup.add(sepalMesh);
 }

 // 花萼底部圆盘
 const receptacleGeo = new THREE.CylinderGeometry(0.14, 0.2, 0.12, 16, 4);
 const receptacle = new THREE.Mesh(receptacleGeo, sepalMaterial);
 receptacle.position.y = -0.18;
 receptacle.castShadow = true;
 receptacle.receiveShadow = true;
 sepalGroup.add(receptacle);

 // ==================== 荧光粒子 ====================
 const particlesGroup = new THREE.Group();
 scene.add(particlesGroup);

 const particleCount = 160;
 const particlePositions = new Float32Array(particleCount * 3);
 const particleSizes = new Float32Array(particleCount);
 const particleBaseData = []; // 存储每个粒子的基础数据用于动画

 for (let i = 0; i < particleCount; i++) {
 // 在花朵周围球形分布
 const theta = Math.random() * Math.PI * 2;
 const phi = Math.random() * Math.PI * 0.75 + 0.15;
 const radius = 1.6 + Math.random() * 2.8;

 const x = Math.sin(phi) * Math.cos(theta) * radius;
 const y = Math.cos(phi) * radius * 0.7 + 0.2;
 const z = Math.sin(phi) * Math.sin(theta) * radius;

 particlePositions[i * 3] = x;
 particlePositions[i * 3 + 1] = y;
 particlePositions[i * 3 + 2] = z;
 particleSizes[i] = 0.015 + Math.random() * 0.06;

 particleBaseData.push({
 baseX: x,
 baseY: y,
 baseZ: z,
 radius,
 theta,
 phi,
 speed: 0.2 + Math.random() * 0.7,
 amplitude: 0.08 + Math.random() * 0.4,
 phase: Math.random() * Math.PI * 2,
 });
 }

 const particleGeometry = new THREE.BufferGeometry();
 particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
 particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

 // 使用圆形纹理的粒子
 const particleCanvas = document.createElement('canvas');
 particleCanvas.width = 64;
 particleCanvas.height = 64;
 const pctx = particleCanvas.getContext('2d');
 const gradient = pctx.createRadialGradient(32, 32, 0, 32, 32, 32);
 gradient.addColorStop(0, 'rgba(255,255,255,1)');
 gradient.addColorStop(0.15, 'rgba(255,255,250,0.85)');
 gradient.addColorStop(0.4, 'rgba(240,240,255,0.35)');
 gradient.addColorStop(0.7, 'rgba(200,210,255,0.04)');
 gradient.addColorStop(1, 'rgba(0,0,0,0)');
 pctx.fillStyle = gradient;
 pctx.fillRect(0, 0, 64, 64);
 const particleTexture = new THREE.CanvasTexture(particleCanvas);
 particleTexture.needsUpdate = true;

 const particleMaterial = new THREE.PointsMaterial({
 color: new THREE.Color('#ffffff'),
 size: 0.06,
 map: particleTexture,
 blending: THREE.AdditiveBlending,
 depthWrite: false,
 depthTest: true,
 transparent: true,
 opacity: 0.7,
 });

 const particles = new THREE.Points(particleGeometry, particleMaterial);
 particlesGroup.add(particles);

 // 第二组更小的粒子，靠近花瓣
 const closeParticleCount = 80;
 const closeParticlePositions = new Float32Array(closeParticleCount * 3);
 const closeParticleBaseData = [];
 for (let i = 0; i < closeParticleCount; i++) {
 const theta = Math.random() * Math.PI * 2;
 const phi = Math.random() * Math.PI * 0.6 + 0.2;
 const radius = 0.8 + Math.random() * 1.6;
 const x = Math.sin(phi) * Math.cos(theta) * radius;
 const y = Math.cos(phi) * radius * 0.6 + 0.18;
 const z = Math.sin(phi) * Math.sin(theta) * radius;
 closeParticlePositions[i * 3] = x;
 closeParticlePositions[i * 3 + 1] = y;
 closeParticlePositions[i * 3 + 2] = z;
 closeParticleBaseData.push({
 baseX: x,
 baseY: y,
 baseZ: z,
 theta,
 phi,
 radius,
 speed: 0.3 + Math.random() * 0.9,
 amplitude: 0.04 + Math.random() * 0.2,
 phase: Math.random() * Math.PI * 2,
 });
 }
 const closeParticleGeometry = new THREE.BufferGeometry();
 closeParticleGeometry.setAttribute('position', new THREE.BufferAttribute(closeParticlePositions, 3));
 const closeParticleMaterial = new THREE.PointsMaterial({
 color: new THREE.Color('#fefeff'),
 size: 0.025,
 map: particleTexture,
 blending: THREE.AdditiveBlending,
 depthWrite: false,
 depthTest: true,
 transparent: true,
 opacity: 0.55,
 });
 const closeParticles = new THREE.Points(closeParticleGeometry, closeParticleMaterial);
 particlesGroup.add(closeParticles);

 // ==================== 花茎 ====================
 const stemGroup = new THREE.Group();
 stemGroup.position.y = -0.45;
 flowerGroup.add(stemGroup);

 const stemCurve = new THREE.CatmullRomCurve3([
 new THREE.Vector3(0, 0.2, 0),
 new THREE.Vector3(0.02, -0.3, 0.01),
 new THREE.Vector3(-0.01, -0.9, -0.02),
 new THREE.Vector3(0.03, -1.6, 0.01),
 new THREE.Vector3(0, -2.4, -0.01),
 ]);

 const stemGeo = new THREE.TubeGeometry(stemCurve, 40, 0.06, 12, false);
 const stemMaterial = new THREE.MeshStandardMaterial({
 color: new THREE.Color('#4a6b3a'),
 roughness: 0.5,
 metalness: 0.04,
 emissive: new THREE.Color('#1a2a10'),
 emissiveIntensity: 0.03,
 side: THREE.DoubleSide,
 });
 const stem = new THREE.Mesh(stemGeo, stemMaterial);
 stem.castShadow = true;
 stem.receiveShadow = true;
 stemGroup.add(stem);

 // 茎上的小节点
 for (let i = 0; i < 3; i++) {
 const nodeGeo = new THREE.SphereGeometry(0.04, 8, 6);
 const node = new THREE.Mesh(nodeGeo, stemMaterial);
 const t = 0.25 + i * 0.28;
 const pt = stemCurve.getPointAt(t);
 node.position.copy(pt);
 node.position.x += (Math.random() - 0.5) * 0.06;
 node.position.z += (Math.random() - 0.5) * 0.06;
 node.scale.set(1, 0.6, 1);
 node.castShadow = true;
 stemGroup.add(node);
 }

 // ==================== 场景中的微妙光晕环 ====================
 const glowRingGeo = new THREE.TorusGeometry(0.55, 0.015, 16, 80);
 const glowRingMaterial = new THREE.MeshStandardMaterial({
 color: new THREE.Color('#ffffff'),
 roughness: 0.2,
 metalness: 0.1,
 emissive: new THREE.Color('#ffffff'),
 emissiveIntensity: 0.1,
 side: THREE.DoubleSide,
 transparent: true,
 opacity: 0.08,
 depthWrite: false,
 });
 const glowRing = new THREE.Mesh(glowRingGeo, glowRingMaterial);
 glowRing.position.y = 0.1;
 glowRing.rotation.x = Math.PI * 0.45;
 flowerGroup.add(glowRing);

 const glowRing2 = new THREE.Mesh(
 new THREE.TorusGeometry(0.7, 0.01, 12, 64),
 new THREE.MeshStandardMaterial({
 color: new THREE.Color('#f8f4ff'),
 roughness: 0.25,
 metalness: 0.08,
 emissive: new THREE.Color('#ffffff'),
 emissiveIntensity: 0.06,
 side: THREE.DoubleSide,
 transparent: true,
 opacity: 0.05,
 depthWrite: false,
 })
 );
 glowRing2.position.y = -0.05;
 glowRing2.rotation.x = Math.PI * 0.52;
 flowerGroup.add(glowRing2);

 // ==================== 动画循环 ====================
 const clock = new THREE.Clock();

 function animate(timestamp) {
 requestAnimationFrame(animate);

 const time = clock.getElapsedTime();
 const dt = Math.min(time - (animate._lastTime || time), 0.1);
 animate._lastTime = time;

 controls.update();

 // ---- 花瓣荧光闪烁 ----
 for (let layerIdx = 0; layerIdx < 8; layerIdx++) {
 const phaseOffset = layerIdx * 1.1;
 const layerFlicker = 1 +
 Math.sin(time * 2.7 + phaseOffset) * 0.15 +
 Math.sin(time * 5.1 + phaseOffset + 1.3) * 0.08 +
 Math.sin(time * 8.3 + phaseOffset + 2.7) * 0.04;
 const baseEmissive = 0.02 - layerIdx * 0.002;
 petalMaterials[layerIdx].emissiveIntensity = Math.max(0.01, baseEmissive * layerFlicker);
 petalMaterials[layerIdx].roughness = 0.4 + (Math.sin(time * 3.4 + phaseOffset) * 0.03);
 }

 // ---- Bloom强度微调 ----
 bloomPass.strength = 0.28 + Math.sin(time * 2.5) * 0.04 + Math.sin(time * 6.3) * 0.02;

 // ---- 粒子动画 ----
 const posArray = particles.geometry.attributes.position.array;
 for (let i = 0; i < particleCount; i++) {
 const pd = particleBaseData[i];
 const floatOffset = Math.sin(time * pd.speed + pd.phase) * pd.amplitude;
 posArray[i * 3] = pd.baseX + floatOffset * Math.sin(pd.phi) * Math.cos(pd.theta);
 posArray[i * 3 + 1] = pd.baseY + floatOffset * Math.cos(pd.phi) * 0.7;
 posArray[i * 3 + 2] = pd.baseZ + floatOffset * Math.sin(pd.phi) * Math.sin(pd.theta);
 }
 particles.geometry.attributes.position.needsUpdate = true;

 // 近距离粒子
 const closePosArray = closeParticles.geometry.attributes.position.array;
 for (let i = 0; i < closeParticleCount; i++) {
 const cpd = closeParticleBaseData[i];
 const floatOff = Math.sin(time * cpd.speed + cpd.phase) * cpd.amplitude;
 closePosArray[i * 3] = cpd.baseX + floatOff * Math.sin(cpd.phi) * Math.cos(cpd.theta);
 closePosArray[i * 3 + 1] = cpd.baseY + floatOff * Math.cos(cpd.phi) * 0.6;
 closePosArray[i * 3 + 2] = cpd.baseZ + floatOff * Math.sin(cpd.phi) * Math.sin(cpd.theta);
 }
 closeParticles.geometry.attributes.position.needsUpdate = true;

 // 粒子整体透明度微调
 particleMaterial.opacity = 0.65 + Math.sin(time * 3.2) * 0.1;
 closeParticleMaterial.opacity = 0.5 + Math.sin(time * 2.8 + 1) * 0.08;

 // ---- 光晕环脉动 ----
 const ringPulse = 1 + Math.sin(time * 2.2) * 0.1 + Math.sin(time * 5.7) * 0.05;
 glowRingMaterial.emissiveIntensity = 0.1 * ringPulse;
 glowRingMaterial.opacity = 0.06 + Math.sin(time * 2.2) * 0.02;
 glowRing.scale.setScalar(1 + Math.sin(time * 3.1) * 0.02);

 // ---- 花蕊微动 ----
 stamenGroup.children.forEach((child, idx) => {
 if (child.isGroup) {
 const microMove = Math.sin(time * 4.5 + idx * 0.7) * 0.015;
 child.position.y += microMove * 0.3;
 }
 });

 // ---- 渲染 ----
 composer.render();
 }

 animate._lastTime = 0;
 requestAnimationFrame(animate);

 // ==================== 响应式处理 ====================
 window.addEventListener('resize', () => {
 camera.aspect = window.innerWidth / window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
 composer.setSize(window.innerWidth, window.innerHeight);
 bloomPass.resolution.set(window.innerWidth, window.innerHeight);
 });

 // ==================== 键盘快捷键 ====================
 window.addEventListener('keydown', (e) => {
 switch (e.key.toLowerCase()) {
 case 'r':
 // 重置视角
 camera.position.set(0.8, 0.55, 5.2);
 controls.target.set(0, 0.22, 0);
 controls.update();
 showHint();
 break;
 case 'f':
 // 前视图
 camera.position.set(0, 0.3, 4.5);
 controls.target.set(0, 0.22, 0);
 controls.update();
 showHint();
 break;
 case 't':
 // 顶部视图
 camera.position.set(0, 4.5, 0.3);
 controls.target.set(0, 0.22, 0);
 controls.update();
 showHint();
 break;
 case 'a':
 // 自动旋转开关
 controls.autoRotate = !controls.autoRotate;
 controls.autoRotateSpeed = controls.autoRotate ? 0.35 : 0;
 showHint();
 break;
 default:
 break;
 }
 });

 console.log('🌺 3D荧光花朵已就绪');
 console.log(' ✦ 花瓣总数:', totalPetals, '片 (5层)');
 console.log(' ✦ 拖拽鼠标旋转 | 滚轮缩放 | 右键平移');
 console.log(' ✦ 按键 R=重置视角 F=正面 T=俯视 A=自动旋转');
 console.log(' ✦ 洁白花瓣 · 曲线边缘 · 荧光特效 · 饱满厚度');
 </script>
